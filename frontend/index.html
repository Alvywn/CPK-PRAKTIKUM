<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NusaChat - Aplikasi Kontak &amp; Akun Sederhana</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>NusaChat</h1>
        <p>Manajemen Akun &amp; Kontak Sederhana (Kriteria 1 &amp; 2)</p>
    </header>

    <main class="container">
        <!-- Pesan Status / Notifikasi -->
        <div id="alert-box" class="alert hidden" role="status"></div>

        <!-- 1. BAGIAN AUTENTIKASI (LOGIN & REGISTER) -->
        <section id="auth-section" class="auth-grid">
            <div class="card">
                <h2>Masuk (Login)</h2>
                <form id="login-form">
                    <label for="login-phone">Nomor HP</label>
                    <input type="text" id="login-phone" placeholder="081234567890" required>

                    <label for="login-password">Kata Sandi</label>
                    <input type="password" id="login-password" placeholder="Masukkan kata sandi" required>

                    <button type="submit" class="btn btn-primary">Masuk</button>
                </form>
            </div>

            <div class="card">
                <h2>Daftar Akun Baru</h2>
                <form id="register-form">
                    <label for="reg-name">Nama Lengkap</label>
                    <input type="text" id="reg-name" placeholder="Budi Santoso" required>

                    <label for="reg-phone">Nomor HP</label>
                    <input type="text" id="reg-phone" placeholder="081234567890" required>

                    <label for="reg-password">Kata Sandi (Min. 6 karakter)</label>
                    <input type="password" id="reg-password" placeholder="Minimal 6 karakter" required>

                    <button type="submit" class="btn btn-primary">Daftar</button>
                </form>
            </div>
        </section>

        <!-- 2. BAGIAN UTAMA SETELAH LOGIN (PROFIL + CRUD KONTAK) -->
        <section id="app-section" class="hidden">
            <div class="card user-bar">
                <div>
                    <strong id="user-name">-</strong>
                    <span id="user-phone" class="muted">-</span>
                </div>
                <div class="btn-group">
                    <button type="button" id="btn-logout" class="btn btn-outline">Keluar</button>
                    <button type="button" id="btn-delete-account" class="btn btn-danger">Hapus Akun</button>
                </div>
            </div>

            <!-- Form Tambah / Ubah Kontak -->
            <div class="card">
                <h2 id="contact-form-title">Tambah Kontak Baru</h2>
                <form id="contact-form" class="inline-form">
                    <input type="hidden" id="contact-id">
                    <div>
                        <label for="contact-name">Nama Kontak</label>
                        <input type="text" id="contact-name" placeholder="Contoh: Siti Aminah" required>
                    </div>
                    <div>
                        <label for="contact-phone">Nomor HP</label>
                        <input type="text" id="contact-phone" placeholder="Contoh: 081298765432" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="btn-save-contact">Simpan</button>
                        <button type="button" class="btn btn-outline hidden" id="btn-cancel-edit">Batal</button>
                    </div>
                </form>
            </div>

            <!-- Daftar Kontak -->
            <div class="card">
                <h2>Daftar Kontak (<span id="contact-count">0</span>)</h2>
                <div id="contacts-container">
                    <p class="muted">Memuat kontak...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
